[package]
name = "crt-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The crt command: composition root for the CLI."

[[bin]]
name = "crt"
path = "src/main.rs"

[dependencies]
crt-app = { path = "../crt-app" }
crt-domain = { path = "../crt-domain" }
crt-html = { path = "../crt-html" }
crt-llm = { path = "../crt-llm" }
crt-lsp = { path = "../crt-lsp" }
crt-store = { path = "../crt-store" }
crt-treesitter = { path = "../crt-treesitter" }
crt-wire = { path = "../crt-wire" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
sha2 = "0.11"
tempfile = "3"

[lints]
workspace = true
