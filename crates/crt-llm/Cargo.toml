[package]
name = "crt-llm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explainer adapter: an OpenAI-compatible chat API with structured output."

[dependencies]
crt-app = { path = "../crt-app" }
crt-domain = { path = "../crt-domain" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
