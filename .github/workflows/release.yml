name: release

# A tag v<version> builds crt for each platform, packages one VS Code
# extension per platform with the binary inside, and opens a DRAFT release.
# Publishing the release (and the extension) stays a manual decision.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, vsce: darwin-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, vsce: darwin-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, vsce: linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, vsce: linux-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, vsce: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p crt-cli --target ${{ matrix.target }}
      - name: Archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          exe=crt; [[ "${{ matrix.target }}" == *windows* ]] && exe=crt.exe
          mkdir -p dist stage
          cp "target/${{ matrix.target }}/release/$exe" stage/
          asset="crt-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$asset" -C stage "$exe"
          if command -v sha256sum >/dev/null; then (cd dist && sha256sum "$asset" > "$asset.sha256");
          else (cd dist && shasum -a 256 "$asset" > "$asset.sha256"); fi
          mkdir -p editors/vscode/bin && cp "stage/$exe" editors/vscode/bin/
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: editors/vscode/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Package the VS Code extension for ${{ matrix.vsce }}
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vsce package --no-dependencies --target ${{ matrix.vsce }} -o "../../dist/code-reading-${{ matrix.vsce }}.vsix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --draft --verify-tag --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
